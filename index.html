<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Search Console verification -->
    <meta
      name="google-site-verification"
      content="K2SPGK_y74tI9bBM2IaqBhWhfmYdSspXfWMwXm2NaBQ"
    />

    <!-- Primary meta -->
    <title>
      Shift Schedule Builder — Free Staff Roster Maker, Print to PDF

    <meta
      name="description"
      content="A free, offline shift scheduler. Build a two-week staff roster (rota) in your browser and print it straight to PDF. No sign-up, no server — your data stays on your device."
    />
    <meta
      name="keywords"
      content="shift scheduler, staff roster maker, rota maker, employee schedule, work schedule template, shift planner, print schedule to PDF, free rota template, staff scheduling app"

    <meta name="author" content="Bhavin Virani" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#151A21" />
    <link rel="canonical" href="https://bhavinvirani.github.io/Scheduler/" />

    <!-- Icons & manifest. Relative hrefs so they resolve under any Pages subpath. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Discord …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shift Schedule Builder" />
    <meta
      property="og:title"
      content="Shift Schedule Builder — Free Staff Roster Maker"
    />
    <meta
      property="og:description"
      content="Build a two-week staff roster in your browser and print it to PDF. No account, no server, works offline."
    />
    <meta
      property="og:url"
      content="https://bhavinvirani.github.io/Scheduler/"
    />
    <meta
      property="og:image"
      content="https://bhavinvirani.github.io/Scheduler/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Shift Schedule Builder grid, color-coded by shift time, with an hours summary."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Shift Schedule Builder — Free Staff Roster Maker"
    />
    <meta
      name="twitter:description"
      content="Build a two-week staff roster in your browser and print it to PDF. No account, no server, works offline."
    />
    <meta
      name="twitter:image"
      content="https://bhavinvirani.github.io/Scheduler/og-image.png"
    />

    <!-- Structured data: helps Google understand this is a free web app. -->
    <script type="application/ld+json">

        "@type": "WebApplication",
        "name": "Shift Schedule Builder",
        "url": "https://bhavinvirani.github.io/Scheduler/",
        "description": "A free, offline web app for building two-week staff shift schedules and printing them to PDF. No account or server required.",

        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript",

        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Bhavin Virani" },
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "featureList": [
          "Two-week shift grid",
          "Reusable shift presets and one-tap fill",
          "Undo and redo",
          "Hours summary per person",
          "Color or black-and-white printing",
          "Print to PDF",
          "Works offline, no account"

        "screenshot": "https://bhavinvirani.github.io/Scheduler/og-image.png"
      }
