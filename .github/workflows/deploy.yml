name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scoped for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gate the deploy on the test suite — a red build never ships.
      - run: npm run test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cut the release only after the site has actually deployed. A failed build
  # or deploy skips this job, so the tag never moves ahead of what is live.
  # The version is read from the conventional commits since the last tag
  # (feat -> minor, fix -> patch, BREAKING CHANGE -> major); docs/chore-only
  # pushes create no tag.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # override the read-only default: needed to tag + release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, so the bump can be computed

      - name: Bump version and tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main

      - name: Publish GitHub release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
