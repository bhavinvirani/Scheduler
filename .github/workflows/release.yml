name: Release

# On every push to main, cut a GitHub release when there is something to
# release. The version bump is read from the conventional-commit messages since
# the last tag (feat -> minor, fix -> patch, BREAKING CHANGE -> major). Pushes
# that only touch docs/chores produce no tag, so releases never get noisy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needs write access to create the tag and publish the release.
permissions:
  contents: write

# Never let two pushes race to tag the same line of history.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, so the bump can be computed

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A red build must never be tagged as a release.
      - run: npm run test
      - run: npm run build

      # Analyse commits since the last tag and create the next one. With
      # default_bump: false, a push with no feat/fix/breaking commit makes no tag.
      - name: Bump version and tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main

      # Publish the release only when a new tag was actually created.
      - name: Publish GitHub release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
