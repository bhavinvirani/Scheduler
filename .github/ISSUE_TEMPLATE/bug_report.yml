name: Bug report
description: Something isn't working the way you expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug. Please fill in what you can; even a rough report helps.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: I clicked a preset and the cell filled with the wrong time.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Add a person
        3. ...
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Chrome 120 on macOS 14
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I could reproduce this on the live app.
          required: false
