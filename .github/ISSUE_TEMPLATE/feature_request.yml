name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that is hard or annoying today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried or considered?
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Fits the project
      description: This app deliberately stays a no-backend, print-first static site.
      options:
        - label: My idea does not require a backend, an account, or an export library.
          required: false
